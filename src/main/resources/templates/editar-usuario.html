
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar usuario</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 650px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #17365d;
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2f75b5;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #17365d;
        }

        .mensaje {
            color: green;
            text-align: center;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>EDITAR USUARIO</h1>

        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/usuarios/actualizar}" method="post">

            <input type="hidden" name="idUsuario"
                   th:value="${usuario.idUsuario}">

            <label>Nombre completo:</label>
            <input type="text" name="nombre"
                   th:value="${usuario.nombre}" required>

            <label>Correo electrónico:</label>
            <input type="email" name="email"
                   th:value="${usuario.email}" required>

            <label>Rol:</label>
            <select name="idRol" required>
                <option th:each="rol : ${roles}"
                        th:value="${rol.idRol}"
                        th:text="${rol.nombre}"
                        th:selected="${rol.idRol == usuario.rol.idRol}">
                </option>
            </select>

            <button type="submit">GUARDAR CAMBIOS</button>

        </form>

        <a class="volver" th:href="@{/usuarios}">
            VOLVER AL LISTADO
        </a>

    </div>

</body>
</html>
