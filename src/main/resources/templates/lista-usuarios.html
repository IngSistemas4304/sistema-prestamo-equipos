<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de usuarios</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #17365d;
            text-align: center;
        }

        .boton {
            display: inline-block;
            padding: 10px 15px;
            background-color: #17365d;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        .boton:hover {
            background-color: #2f75b5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #17365d;
            color: white;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            color: #17365d;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>GESTIÓN DE USUARIOS</h1>
		
		<p th:if="${mensaje}" th:text="${mensaje}"></p>
		<p th:if="${error}" th:text="${error}"></p>

        <a class="boton" th:href="@{/usuarios/nuevo}">
            REGISTRAR USUARIO
        </a>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>NOMBRE</th>
                    <th>CORREO</th>
                    <th>ROL</th>
                    <th>ESTADO</th>
					<th>ACCIONES</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.idUsuario}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td th:text="${usuario.rol.nombre}"></td>
                    <td th:text="${usuario.estado}"></td>
					<td>
					    <a th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">
					        EDITAR
					    </a>
						<form th:action="@{/usuarios/desactivar}" method="post"
						      th:if="${usuario.estado == 'ACTIVO'}">

						    <input type="hidden" name="idUsuario"
						           th:value="${usuario.idUsuario}">

						    <button type="submit">DESACTIVAR</button>

						</form>
						<span th:if="${usuario.estado == 'INACTIVO'}">
						    USUARIO INACTIVO
						</span>
					</td>
                </tr>

                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="6">No hay usuarios registrados</td>
                </tr>

            </tbody>

        </table>

        <a class="volver" th:href="@{/}">
            Volver al menú principal
        </a>

    </div>

</body>
</html>
