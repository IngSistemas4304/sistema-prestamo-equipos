<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes pendientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #17365d;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #17365d;
            color: white;
        }

        textarea {
            width: 95%;
            min-height: 60px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }

        button {
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 3px;
        }

        .aprobar {
            background: #218838;
        }

        .rechazar {
            background: #c0392b;
        }

        .mensaje {
            text-align: center;
            padding: 20px;
        }

        .alerta {
            text-align: center;
            padding: 12px;
            margin: 12px 0;
            border-radius: 5px;
        }

        .exito {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
<div class="contenedor">

    <h1>Solicitudes pendientes</h1>
    <p>Revisa las solicitudes realizadas por los usuarios.</p>

    <p th:if="${mensaje}" class="alerta exito"
       th:text="${mensaje}"></p>

    <p th:if="${error}" class="alerta error"
       th:text="${error}"></p>

    <table>
        <thead>
            <tr>
                <th>N.º solicitud</th>
                <th>Usuario</th>
                <th>Equipo</th>
                <th>Fecha inicio</th>
                <th>Fecha devolución</th>
                <th>Motivo</th>
                <th>Observación y decisión</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="solicitud : ${solicitudes}">
                <td th:text="${solicitud.idSolicitud}"></td>
                <td th:text="${solicitud.idUsuario}"></td>
                <td th:text="${solicitud.idEquipo}"></td>
                <td th:text="${solicitud.fechaInicio}"></td>
                <td th:text="${solicitud.fechaFin}"></td>
                <td th:text="${solicitud.motivo}"></td>

                <td>
                    <form th:action="@{/decisiones/{idSolicitud}(idSolicitud=${solicitud.idSolicitud})}"
                          method="post">

                        <textarea name="observacion"
                                  maxlength="500"
                                  placeholder="Escribe una observación (opcional)"></textarea>

                        <button type="submit"
                                name="decision"
                                value="APROBADA"
                                class="aprobar">
                            Aprobar
                        </button>

                        <button type="submit"
                                name="decision"
                                value="RECHAZADA"
                                class="rechazar">
                            Rechazar
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(solicitudes)}">
                <td colspan="7" class="mensaje">
                    No hay solicitudes pendientes.
                </td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
