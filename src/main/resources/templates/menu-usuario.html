<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 650px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
            text-align: center;
        }

        h1 {
            color: #17365d;
        }

        p {
            color: #555;
        }

        a {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 18px;
            background-color: #17365d;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        a:hover {
            background-color: #2f75b5;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>GESTIÓN DE USUARIOS</h1>

        <p>Seleccione la operación que desea realizar.</p>

        <a th:href="@{/usuarios/nuevo}">
            REGISTRAR USUARIO
        </a>

        <a th:href="@{/usuarios}">
            CONSULTAR USUARIOS
        </a>

        <a th:href="@{/solicitudes/mis-solicitudes}">
            MIS SOLICITUDES
        </a>

        <a th:href="@{/}">
            VOLVER AL MENÚ PRINCIPAL
        </a>

    </div>

</body>
</html>
